# This config is an example TPU config allowing you to run
# https://github.com/Yard1/swarm-jax on GCP TPUs
# Replace provider.project_id with your GCP project id
# After the nodes are up, run:
#   ray attach tpu.yaml swarm_tpu_jax.py swarm-jax/data/enwik8 [NUM_TPUS] [EPOCHS]

# A unique identifier for the head node and workers of this cluster.
cluster_name: hackhacktputest

# The maximum number of worker nodes to launch in addition to the head
# node.
max_workers: 7

available_node_types:
    ray_head_default:
        resources: {"CPU": 2}
        node_config:
            machineType: n2-standard-2
            disks:
              - boot: true
                autoDelete: true
                type: PERSISTENT
                initializeParams:
                  diskSizeGb: 50
                  # See https://cloud.google.com/compute/docs/images for more images
                  sourceImage: projects/deeplearning-platform-release/global/images/family/common-cpu
    ray_tpu:
        min_workers: 1
        resources: {"TPU": 4}  # use TPU custom resource in your code
        node_config:
            # Only v2-8 and v3-8 accelerator types are currently supported.
            # Support for TPU pods will be added in the future.
            acceleratorType: v2-32
            runtimeVersion: v2-alpha
            schedulingConfig:
                # Set to false to use non-preemptible TPUs
                preemptible: false

provider:
    type: gcp
    region: us-central1
    availability_zone: us-central1-a
    project_id: hidden-cosmos-347615  # replace with your GCP project id
    cache_stopped_nodes: False
    foreground_node_launch: true

setup_commands: []

# Specify the node type of the head node (as configured above).
# TPUs cannot be head nodes (will raise an exception).
head_node_type: ray_head_default

# Compute instances have python 3.7, but TPUs have 3.8 - need to update
# Install Jax and other dependencies on the Compute head node
head_setup_commands:
  # Two first lines are a workaround for ssh timing out
  - conda activate ray || conda create -y -n "ray" python=3.8.10
  - echo 'conda activate ray' >> ~/.bashrc
  - python -m pip install --upgrade pip
  - python -m pip install --upgrade "jax[cpu]" typing_extensions
  - python -m pip install --upgrade ray
  - ray install-nightly
  - rm -rf ray || echo ok
  - git clone -b hackathon/tpu_pod https://github.com/DmitriGekhtman/ray
  - python ray/python/ray/setup-dev.py -y
  - pip install google-api-python-client==1.7.8
  - pip install cryptography>=3.0.0
  - pip install ml_collections
  - pip install tensorflow_datasets
  - pip install tensorflow clu
  - git clone https://github.com/JiahaoYao/ray-jax-tpu-pod-hackathon || echo ok

# Install Jax and other dependencies on TPU
worker_setup_commands:
  - pip3 install --upgrade pip
  - pip3 install --upgrade "jax[tpu]" -f https://storage.googleapis.com/jax-releases/libtpu_releases.html
  - pip3 install --upgrade fabric dataclasses optax==0.0.6 git+https://github.com/deepmind/dm-haiku tensorboardX ray[default]
  - python3 -c "import jax; jax.device_count(); jax.numpy.add(1, 1)"  # test if Jax has been installed correctly
  - ray install-nightly
  - pip3 install ml_collections typing_extensions
  - pip3 install tensorflow_datasets
  - pip3 install tensorflow 
  - pip3 install flax clu
  - pip3 install einops
  - pip3 install Pillow moviepy proglog scikit-image

head_start_ray_commands:
    - ray stop
    - >-
      ulimit -n 65536;
      ray start
      --head
      --port=6379
      --object-manager-port=8076
      --autoscaling-config=~/ray_bootstrap_config.yaml

# Command to start ray on worker nodes. You don't need to change this.
worker_start_ray_commands:
    - ray stop
    - >-
      ulimit -n 65536;
      ray start
      --address=$RAY_HEAD_IP:6379
      --object-manager-port=8076
